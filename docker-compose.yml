# Production-like stack on one machine: PostgreSQL + MinIO (S3) + web/API + worker.
#
#   docker compose up --build                 # CPU worker in demo mode (synthetic analysis), no GPU needed
#   docker compose --profile gpu up --build   # plus the real GPU worker (NVIDIA Container Toolkit)
#
# Open http://localhost:8000 and sign up with invite code "rallyiq" (see RALLYIQ_INVITE_CODE).
# Online, the same images run on managed services instead: docs/deploy.md.

x-env: &env
  RALLYIQ_DATABASE_URL: postgresql://rallyiq:rallyiq@postgres:5432/rallyiq
  RALLYIQ_STORAGE: s3://rallyiq
  RALLYIQ_S3_ENDPOINT: http://minio:9000
  RALLYIQ_S3_PUBLIC_ENDPOINT: http://localhost:9000   # presigned URLs the browser opens
  RALLYIQ_S3_REGION: us-east-1
  AWS_ACCESS_KEY_ID: rallyiq
  AWS_SECRET_ACCESS_KEY: rallyiq-secret

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rallyiq
      POSTGRES_PASSWORD: rallyiq
      POSTGRES_DB: rallyiq
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rallyiq"]
      interval: 2s
      retries: 30

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: rallyiq
      MINIO_ROOT_PASSWORD: rallyiq-secret
      MINIO_API_CORS_ALLOW_ORIGIN: http://localhost:8000
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      retries: 30

  minio-init:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z   # ships the mc client
    depends_on:
      minio: {condition: service_healthy}
    entrypoint: ["sh", "-c", "mc alias set m http://minio:9000 rallyiq rallyiq-secret && mc mb -p m/rallyiq && mc anonymous set none m/rallyiq"]

  api:
    build: .
    image: rallyiq-api
    environment:
      <<: *env
      RALLYIQ_WORKER: external
      RALLYIQ_AUTH: "on"
      RALLYIQ_SIGNUP: invite
      RALLYIQ_INVITE_CODE: rallyiq
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      minio-init: {condition: service_completed_successfully}

  worker-demo:
    image: rallyiq-api
    command: ["python", "-m", "rallyiq.pipeline", "worker", "--demo"]
    environment: *env
    depends_on: [api]

  worker:
    profiles: [gpu]
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    image: rallyiq-worker
    environment: *env
    depends_on: [api]
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, count: 1, capabilities: [gpu]}]

volumes:
  pgdata:
  minio:
