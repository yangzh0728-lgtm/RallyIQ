# 自有素材片段清单（sam 自己拍的业余比赛和对练，原片在外接硬盘上）
#
# 仓库只保存文件名、时间段和人工标注，不保存任何视频或帧图像，也不写人名。
# 原片根目录默认 /Volumes/T7/YZH/Badminton Film，可用 --footage 或环境变量
# RALLYIQ_FOOTAGE 覆盖。extract_clips 在根目录下按文件名查找（DJI 文件名唯一），
# 只切出清单里的时间段，缩到 1080p 以内，放进和 BWF 片段相同的 clips 目录，
# 所以 real_run / label_tool / shuttle_loop 不用改用法。
#
# 字段和 clips.yaml 相同，只是用 file 代替 video_id：
#   file          原片文件名（在根目录下递归查找）
#   start_s       片段在原片中的起点（秒）。标注时间仍是原片毫秒时间
#   holdout       true = 整段只当考试题，shuttle_loop 不拿它训练
#   segment_verified  false = 起点只是取了原片中间，还没确认画面里是回合；
#                 抽片后快速看一眼，必要时调整 start_s
#   court_points  固定机位的球场点，{球场线交点名: [x, y]}，坐标是切好的片段画面（1920×1080）。
#                 名字是 "横线/竖线"，如 near_short_service/centre_line。有了它 real_run 整段直接用
#                 这个球场，不再自动标定。点由画面里的白线拟合直线后求交点得到，投影回画面核对过。
#                 同一场次机位没动时用 YAML 锚点（&名字 / *名字）共用一份
#
# 机位（conditions.camera）：
#   amateur_baseline   底线后方低机位，整块场地可见（与 DJI_0009 同类）
#   amateur_side       场边斜角低机位
#   amateur_multicourt 高中比赛场馆，画面里同时有多块球场，用于验证目标球场锁定

