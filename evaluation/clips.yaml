# 素材仅用于个人内部研究与识别精度评测，不得再分发或用于商业用途。
#
# 字段：
#   id            片段编号（标注文件名 labels/<id>.json）
#   video_id      YouTube 视频 ID
#   start_s       片段在原视频中的起点（秒）
