#                 尚未人工确认画面里是比赛回合；抽片后请快速确认，必要时调整 start_s
#   split         eval（只评测，不训练）/ train（可用于微调）
#   conditions    用于分组报告精度的条件标签
#
# 选片原则：单打/双打/混双均覆盖；场馆覆盖伯明翰、巴黎、东京、雅加达、
# 欧登塞、萨尔布吕肯、丽水、杭州等；包含非主场地固定机位（副场直播流）
