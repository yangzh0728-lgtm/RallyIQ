name: docker
on:
  pull_request:
    paths: ["Dockerfile", "docker/**", "docker-compose.yml", "rallyiq/**", "web/**", "pyproject.toml",
            "scripts/smoke_online.py", "scripts/fetch_weights.sh", ".github/workflows/docker.yml"]
  push:
    branches: [main]
jobs:
  stack:
    # Full online stack (PostgreSQL + MinIO + web/API + demo worker) end to end.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: docker compose build api
      - run: docker compose up -d api worker-demo
      - run: |
          for i in $(seq 60); do curl -fs localhost:8000/api/health && break; sleep 2; done
          ffmpeg -v error -f lavfi -i testsrc=size=640x360:rate=30 -t 8 -pix_fmt yuv420p clip.mp4
          python scripts/smoke_online.py --base http://localhost:8000 --video clip.mp4 --invite rallyiq
      - if: failure()
        run: docker compose logs --no-color | tail -200
  worker-image:
    # The GPU worker image must at least build (weights are downloaded at deploy time, not in CI).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Free disk for the CUDA base image
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - run: docker build -f docker/worker.Dockerfile --build-arg FETCH_WEIGHTS=0 -t rallyiq-worker .
      - run: docker run --rm --entrypoint python rallyiq-worker -c "import rallyiq.perception.shuttle.stage, rallyiq.perception.players.stage, torch, onnxruntime, boto3, psycopg; print('ok', torch.__version__)"
